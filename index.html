<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Infinite Pro Drawing App</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --nav-bg: rgba(25, 25, 25, 0.95);
            --text-color: #ffffff;
            --border-color: #333333;
            --active-color: #4da3ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: sans-serif;
            overscroll-behavior-y: contain; 
            touch-action: none; /* Prevents mobile pull-to-refresh blank screens */
        }

        #canvasWrapper {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: absolute;
            top: 0; 
            left: 0;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Top Action Bar (Undo, Redo) */
        .top-actions {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            padding: 0;
            z-index: 100;
            box-shadow: none;
            touch-action: none;
            transition: opacity 0.2s ease;
        }

        /* Smaller, circular floating buttons */
        .top-actions button {
            width: 32px;
            height: 32px;
            font-size: 14px;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .top-actions button:active {
            color: var(--active-color);
            background: rgba(255, 255, 255, 0.1);
        }

        .toolbar-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            width: max-content;
            max-width: 95vw;
        }

        .toolbar {
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .sub-toolbar {
            display: none; 
            padding: 10px 15px;
            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toolbar-minimized {
            display: none;
            width: 50px;
            height: 50px;
            background: var(--nav-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            color: var(--text-color);
        }

        .toolbar-container.squeezed {
            left: auto;
            right: 20px;
            bottom: 20px;
            transform: none;
        }
        .toolbar-container.squeezed .toolbar {
            display: none !important;
        }
        .toolbar-container.squeezed .toolbar-minimized {
            display: flex;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap; 
        }

        button.tool-btn {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 16px;
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        button.tool-btn:active, button.tool-btn.active {
            color: var(--active-color);
            background: rgba(255, 255, 255, 0.1);
        }

        .color-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
        }

        .color-btn.active {
            border-color: #ffffff;
            transform: scale(1.2);
        }

        .hex-input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 10px;
            border-radius: 10px;
            gap: 5px;
        }

        .hex-input-wrapper input {
            background: transparent;
            border: none;
            color: var(--text-color);
            width: 55px;
            outline: none;
            font-family: monospace;
            font-size: 12px;
        }

        .divider {
            width: 1px;
            height: 24px;
            background: var(--border-color);
            margin: 0 3px;
        }

        input[type="range"] {
            accent-color: var(--active-color);
            width: 80px;
        }
    </style>
</head>
<body>

    <div id="canvasWrapper">
        <canvas id="drawingCanvas"></canvas>
    </div>

    <div class="top-actions" id="topActionsBar">
        <button id="undoBtn" title="Undo"><i class="fa-solid fa-rotate-left"></i></button>
        <button id="redoBtn" title="Redo"><i class="fa-solid fa-rotate-right"></i></button>
    </div>

    <div class="toolbar-container" id="toolbarContainer">
        
        <div class="toolbar sub-toolbar" id="eraserSliderMenu">
            <div class="row">
                <span id="eraserLabel" style="min-width: 40px; font-size: 14px;">25px</span>
                <input type="range" id="eraserSlider" min="1" max="100" value="25">
            </div>
        </div>

        <div class="toolbar sub-toolbar" id="penSubMenu">
            <div class="row">
                <button class="tool-btn active" id="tool-ball" title="Ball Pen (Solid)"><i class="fa-solid fa-pen"></i></button>
                <button class="tool-btn" id="tool-ink" title="Ink Pen (Smooth)"><i class="fa-solid fa-pen-nib"></i></button>
                <button class="tool-btn" id="tool-pencil" title="Pencil (Soft)"><i class="fa-solid fa-pencil"></i></button>
                <button class="tool-btn" id="tool-brush" title="Paint Brush (Thick)"><i class="fa-solid fa-paintbrush"></i></button>
                <button class="tool-btn" id="tool-highlighter" title="Highlighter"><i class="fa-solid fa-marker"></i></button>
                <div class="divider"></div>
                <span id="penLabel" style="min-width: 35px; font-size: 14px;">5px</span>
                <input type="range" id="penSlider" min="1" max="100" value="5">
            </div>
        </div>

        <div class="toolbar-minimized" id="expandBtn">
            <i class="fa-solid fa-expand"></i>
        </div>
        
        <div class="toolbar" id="mainToolbar">
            <div class="row">
                <div class="color-btn active" style="background-color: #ffffff;" data-color="#ffffff"></div>
                <div class="color-btn" style="background-color: #ff3b30;" data-color="#ff3b30"></div>
                <div class="color-btn" style="background-color: #007aff;" data-color="#007aff"></div>
                <div class="color-btn" style="background-color: #34c759;" data-color="#34c759"></div>
                <div class="color-btn" style="background-color: #ffcc00;" data-color="#ffcc00"></div>
                <div class="hex-input-wrapper">
                    <span>#</span>
                    <input type="text" id="hexInput" value="ffffff" maxlength="6">
                </div>
            </div>

            <div class="row">
                <button class="tool-btn" id="tool-select" title="Select Tool"><i class="fa-solid fa-arrow-pointer"></i></button>
                <button class="tool-btn" id="tool-hand" title="Pan Canvas"><i class="fa-regular fa-hand"></i></button>
                <div class="divider"></div>
                
                <button class="tool-btn active" id="tool-master-pen" title="Pen Options"><i class="fa-solid fa-pen"></i></button>
                <button class="tool-btn" id="tool-eraser" title="Eraser"><i class="fa-solid fa-eraser"></i></button>
                <button class="tool-btn" id="tool-rect" title="Square"><i class="fa-regular fa-square"></i></button>
                <button class="tool-btn" id="tool-circle" title="Circle"><i class="fa-regular fa-circle"></i></button>
                <button class="tool-btn" id="tool-line" title="Line"><i class="fa-solid fa-minus"></i></button>
                
                <div class="divider"></div>
                <button class="tool-btn" id="fullscreenBtn" title="Full Screen"><i class="fa-solid fa-expand"></i></button>
                <button class="tool-btn" id="gridBtn" title="Toggle Grid"><i class="fa-solid fa-border-none"></i></button>
                <button class="tool-btn" id="recenterBtn" title="Fit to Screen"><i class="fa-solid fa-crosshairs"></i></button>
                <button class="tool-btn" id="zoomLockBtn" title="Lock Zoom"><i class="fa-solid fa-lock-open"></i></button>
                
                <div class="divider"></div>
                <button class="tool-btn" id="clearBtn" title="Clear Canvas" style="color: #ff3b30;"><i class="fa-solid fa-trash-can"></i></button>
                <div class="divider"></div>
                <button class="tool-btn" id="squeezeBtn" title="Squeeze Menu"><i class="fa-solid fa-compress"></i></button>
            </div>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('canvasWrapper');
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); 
        
        const pointers = new Map();
        let gestureActive = false;
        let prevDiff = -1;
        let prevMid = {x: 0, y: 0};

        let strokes = []; 
        let currentStroke = null; 
        let redoStack = [];

        let isDrawing = false;
        let isPanning = false;
        let lastClientPos = {x: 0, y: 0};
        let isZoomLocked = false;
        let showGrid = false;

        let selectedIndex = -1;
        let transformAction = null; 
        let transformOrigin = {x: 0, y: 0};
        let startBoundingBox = null;

        let currentTool = 'ball';
        let brushColor = '#ffffff';
        let penSize = 5;
        let eraserSize = 25;

        let zoomLevel = 1;
        let panX = 0;
        let panY = 0;

        let snapTimer = null;
        const SNAP_DELAY = 600;

        function saveToLocal() {
            try { localStorage.setItem('pwaDrawingV5', JSON.stringify(strokes)); } catch (e) { }
        }

        function loadFromLocal() {
            const savedData = localStorage.getItem('pwaDrawingV5');
            if (savedData) {
                try { strokes = JSON.parse(savedData); } catch (e) { strokes = []; }
            }
        }

        function initCanvas() {
            const ratio = window.devicePixelRatio || 1;
            canvas.width = Math.max(window.innerWidth * ratio, 1);
            canvas.height = Math.max(window.innerHeight * ratio, 1);
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            redraw();
        }

        window.addEventListener('resize', initCanvas);
        loadFromLocal(); 
        initCanvas();

        function getBoundingBox(stroke) {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            stroke.points.forEach(p => {
                if(p.x < minX) minX = p.x;
                if(p.y < minY) minY = p.y;
                if(p.x > maxX) maxX = p.x;
                if(p.y > maxY) maxY = p.y;
            });
            const pad = (stroke.size / 2) + 15; 
            return { x: minX - pad, y: minY - pad, w: (maxX - minX) + pad*2, h: (maxY - minY) + pad*2 };
        }

        function checkHit(worldPos) {
            for (let i = strokes.length - 1; i >= 0; i--) {
                const box = getBoundingBox(strokes[i]);
                if (worldPos.x >= box.x && worldPos.x <= box.x + box.w && 
                    worldPos.y >= box.y && worldPos.y <= box.y + box.h) return i;
            }
            return -1;
        }

        function getHandleHit(worldPos, box) {
            const hs = 15 / zoomLevel; 
            const handles = {
                'resize-tl': {x: box.x, y: box.y},
                'resize-tr': {x: box.x + box.w, y: box.y},
                'resize-bl': {x: box.x, y: box.y + box.h},
                'resize-br': {x: box.x + box.w, y: box.y + box.h}
            };
            for (const [key, pos] of Object.entries(handles)) {
                if (worldPos.x >= pos.x - hs && worldPos.x <= pos.x + hs &&
                    worldPos.y >= pos.y - hs && worldPos.y <= pos.y + hs) return key;
            }
            return null;
        }

        function drawGridLayer() {
            if (!showGrid) return;
            const size = 50 * zoomLevel;
            const ratio = window.devicePixelRatio || 1;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            
            const offsetX = (panX * ratio) % size;
            const offsetY = (panY * ratio) % size;
            
            for(let x = offsetX; x < canvas.width; x += size) {
                for(let y = offsetY; y < canvas.height; y += size) {
                    ctx.beginPath();
                    ctx.arc(x, y, 1.5 * ratio, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }

        function renderFreehand(stroke) {
            const pts = stroke.points;
            if (pts.length === 0) return;
            
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            let baseSize = stroke.size;
            ctx.globalAlpha = 1.0;

            if (stroke.tool === 'highlighter') {
                ctx.globalAlpha = 0.35;
                baseSize = stroke.size * 3;
            } else if (stroke.tool === 'pencil') {
                ctx.globalAlpha = 0.5;
                baseSize = stroke.size * 0.5;
            } else if (stroke.tool === 'brush') {
                ctx.globalAlpha = 0.9;
                baseSize = stroke.size * 1.5;
            }

            ctx.lineWidth = Math.max(0.5, baseSize);
            ctx.strokeStyle = stroke.tool === 'eraser' ? '#000000' : stroke.color;

            if (pts.length === 1) {
                ctx.beginPath();
                ctx.fillStyle = ctx.strokeStyle;
                ctx.arc(pts[0].x, pts[0].y, ctx.lineWidth / 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
                return;
            }

            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            
            for(let i = 1; i < pts.length - 1; i++) {
                const midX = (pts[i].x + pts[i+1].x) / 2;
                const midY = (pts[i].y + pts[i+1].y) / 2;
                ctx.quadraticCurveTo(pts[i].x, pts[i].y, midX, midY);
            }
            
            ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y); 
            ctx.stroke();
            ctx.globalAlpha = 1.0; 
        }

        function redraw() {
            const ratio = window.devicePixelRatio || 1;
            
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawGridLayer(); 

            ctx.scale(ratio, ratio);
            ctx.translate(panX, panY);
            ctx.scale(zoomLevel, zoomLevel);

            const allStrokes = currentStroke ? [...strokes, currentStroke] : strokes;

            allStrokes.forEach((stroke, index) => {
                if (stroke.points.length === 0) return;

                if (['ball', 'ink', 'pencil', 'brush', 'highlighter', 'eraser'].includes(stroke.tool)) {
                    renderFreehand(stroke);
                } else {
                    if(stroke.points.length < 2) return;
                    ctx.lineWidth = stroke.size;
                    ctx.strokeStyle = stroke.color;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    const start = stroke.points[0];
                    const end = stroke.points[stroke.points.length - 1]; 
                    ctx.beginPath();
                    if (stroke.tool === 'rect') {
                        ctx.rect(start.x, start.y, end.x - start.x, end.y - start.y);
                    } else if (stroke.tool === 'circle') {
                        let radius = Math.hypot(end.x - start.x, end.y - start.y);
                        ctx.arc(start.x, start.y, radius, 0, 2 * Math.PI);
                    } else if (stroke.tool === 'line') {
                        ctx.moveTo(start.x, start.y);
                        ctx.lineTo(end.x, end.y);
                    }
                    ctx.stroke();
                }

                if (index === selectedIndex && currentTool === 'select') {
                    const box = getBoundingBox(stroke);
                    ctx.lineWidth = 2 / zoomLevel;
                    ctx.strokeStyle = '#4da3ff';
                    ctx.setLineDash([5 / zoomLevel, 5 / zoomLevel]);
                    ctx.strokeRect(box.x, box.y, box.w, box.h);
                    ctx.setLineDash([]);

                    const hs = 10 / zoomLevel;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(box.x - hs/2, box.y - hs/2, hs, hs); 
                    ctx.fillRect(box.x + box.w - hs/2, box.y - hs/2, hs, hs); 
                    ctx.fillRect(box.x - hs/2, box.y + box.h - hs/2, hs, hs); 
                    ctx.fillRect(box.x + box.w - hs/2, box.y + box.h - hs/2, hs, hs); 
                }
            });
        }

        function getWorldPos(e) {
            return {
                x: (e.clientX - panX) / zoomLevel,
                y: (e.clientY - panY) / zoomLevel
            };
        }

        function startAction(e) {
            // Ignore toolbar clicks
            if (e.target.closest('.toolbar-container') || e.target.closest('.top-actions')) return; 
            pointers.set(e.pointerId, e);

            if (pointers.size === 2) {
                gestureActive = true;
                currentStroke = null;
                transformAction = null;
                clearTimeout(snapTimer); 
                const pts = Array.from(pointers.values());
                prevDiff = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
                prevMid = { x: (pts[0].clientX + pts[1].clientX)/2, y: (pts[0].clientY + pts[1].clientY)/2 };
                redraw();
                return;
            }

            if (pointers.size === 1 && !gestureActive) {
                const pos = getWorldPos(e);
                lastClientPos = { x: e.clientX, y: e.clientY };

                if (currentTool === 'select') {
                    if (selectedIndex !== -1) {
                        const box = getBoundingBox(strokes[selectedIndex]);
                        const handleHit = getHandleHit(pos, box);
                        if (handleHit) {
                            transformAction = handleHit;
                            startBoundingBox = { ...box };
                            if (handleHit === 'resize-tl') transformOrigin = {x: box.x + box.w, y: box.y + box.h};
                            if (handleHit === 'resize-tr') transformOrigin = {x: box.x, y: box.y + box.h};
                            if (handleHit === 'resize-bl') transformOrigin = {x: box.x + box.w, y: box.y};
                            if (handleHit === 'resize-br') transformOrigin = {x: box.x, y: box.y};
                            strokes[selectedIndex].originalPoints = JSON.parse(JSON.stringify(strokes[selectedIndex].points));
                            return;
                        } else if (pos.x >= box.x && pos.x <= box.x + box.w && pos.y >= box.y && pos.y <= box.y + box.h) {
                            transformAction = 'move';
                            return;
                        }
                    }
                    selectedIndex = checkHit(pos);
                    transformAction = selectedIndex !== -1 ? 'move' : null;
                    redraw();
                    return;
                }

                if (currentTool === 'hand') {
                    isPanning = true;
                    wrapper.style.cursor = "grabbing";
                    return;
                }
                
                isDrawing = true;
                selectedIndex = -1; 
                currentStroke = {
                    tool: currentTool,
                    color: brushColor,
                    size: currentTool === 'eraser' ? eraserSize : penSize,
                    points: [pos] 
                };
                
                resetSnapTimer();
                redraw(); 
            }
        }

        function resetSnapTimer() {
            clearTimeout(snapTimer);
            if (['ball', 'ink', 'pencil', 'brush', 'highlighter'].includes(currentTool)) {
                snapTimer = setTimeout(() => {
                    if (isDrawing && currentStroke && currentStroke.points.length > 5) {
                        currentStroke.tool = 'line';
                        currentStroke.points = [currentStroke.points[0], currentStroke.points[currentStroke.points.length-1]];
                        redraw();
                    }
                }, SNAP_DELAY);
            }
        }

        function moveAction(e) {
            if (!pointers.has(e.pointerId)) return;
            pointers.set(e.pointerId, e); 

            if (pointers.size === 2) {
                const pts = Array.from(pointers.values());
                const curDiff = Math.hypot(pts[0].clientX - pts[1].clientX, pts[0].clientY - pts[1].clientY);
                const curMid = { x: (pts[0].clientX + pts[1].clientX)/2, y: (pts[0].clientY + pts[1].clientY)/2 };

                if (prevDiff > 0) {
                    if (!isZoomLocked) {
                        const scaleChange = curDiff / prevDiff;
                        const newZoom = Math.max(0.05, zoomLevel * scaleChange); 
                        const midWorldX = (curMid.x - panX) / zoomLevel;
                        const midWorldY = (curMid.y - panY) / zoomLevel;
                        zoomLevel = newZoom;
                        panX = curMid.x - (midWorldX * zoomLevel);
                        panY = curMid.y - (midWorldY * zoomLevel);
                    }
                    panX += (curMid.x - prevMid.x);
                    panY += (curMid.y - prevMid.y);
                    redraw();
                }
                prevDiff = curDiff;
                prevMid = curMid;
                return;
            }

            if (pointers.size === 1 && !gestureActive) {
                
                if (currentTool === 'select' && transformAction && selectedIndex !== -1) {
                    const pos = getWorldPos(e);
                    const stroke = strokes[selectedIndex];

                    if (transformAction === 'move') {
                        const dx = (e.clientX - lastClientPos.x) / zoomLevel;
                        const dy = (e.clientY - lastClientPos.y) / zoomLevel;
                        stroke.points.forEach(p => { p.x += dx; p.y += dy; });
                    } else if (transformAction.startsWith('resize')) {
                        let scaleX = 1, scaleY = 1;
                        if (transformAction === 'resize-br') {
                            scaleX = (pos.x - transformOrigin.x) / startBoundingBox.w;
                            scaleY = (pos.y - transformOrigin.y) / startBoundingBox.h;
                        } else if (transformAction === 'resize-tl') {
                            scaleX = (transformOrigin.x - pos.x) / startBoundingBox.w;
                            scaleY = (transformOrigin.y - pos.y) / startBoundingBox.h;
                        } else if (transformAction === 'resize-tr') {
                            scaleX = (pos.x - transformOrigin.x) / startBoundingBox.w;
                            scaleY = (transformOrigin.y - pos.y) / startBoundingBox.h;
                        } else if (transformAction === 'resize-bl') {
                            scaleX = (transformOrigin.x - pos.x) / startBoundingBox.w;
                            scaleY = (pos.y - transformOrigin.y) / startBoundingBox.h;
                        }

                        if(Math.abs(scaleX) < 0.1) scaleX = scaleX < 0 ? -0.1 : 0.1;
                        if(Math.abs(scaleY) < 0.1) scaleY = scaleY < 0 ? -0.1 : 0.1;

                        stroke.points = stroke.originalPoints.map(p => ({
                            x: transformOrigin.x + (p.x - transformOrigin.x) * scaleX,
                            y: transformOrigin.y + (p.y - transformOrigin.y) * scaleY
                        }));
                    }
                    lastClientPos = { x: e.clientX, y: e.clientY };
                    redraw();
                    return;
                }

                if (isPanning && currentTool === 'hand') {
                    panX += (e.clientX - lastClientPos.x);
                    panY += (e.clientY - lastClientPos.y);
                    lastClientPos = { x: e.clientX, y: e.clientY };
                    redraw();
                    return;
                }

                if (isDrawing && currentStroke) {
                    const distMoved = Math.hypot(e.clientX - lastClientPos.x, e.clientY - lastClientPos.y);
                    if (distMoved > 3) resetSnapTimer();

                    currentStroke.points.push(getWorldPos(e));
                    lastClientPos = { x: e.clientX, y: e.clientY };
                    redraw();
                }
            }
        }

        function endAction(e) {
            pointers.delete(e.pointerId);
            if (pointers.size < 2) prevDiff = -1;
            clearTimeout(snapTimer); 

            if (pointers.size === 0) {
                gestureActive = false;
                
                if (transformAction) {
                    if (selectedIndex !== -1 && strokes[selectedIndex].originalPoints) {
                        delete strokes[selectedIndex].originalPoints;
                    }
                    transformAction = null;
                    saveToLocal();
                }

                if (isPanning) {
                    isPanning = false;
                    wrapper.style.cursor = "default";
                }
                
                if (isDrawing && currentStroke) {
                    isDrawing = false;
                    
                    if (!['ball', 'ink', 'pencil', 'brush', 'highlighter', 'eraser'].includes(currentStroke.tool)) {
                        currentStroke.points = [currentStroke.points[0], currentStroke.points[currentStroke.points.length-1]];
                    }
                    
                    strokes.push(currentStroke);
                    redoStack = []; 
                    currentStroke = null;
                    redraw();
                    saveToLocal(); 
                }
            }
        }

        wrapper.addEventListener('pointerdown', startAction);
        window.addEventListener('pointermove', moveAction);
        window.addEventListener('pointerup', endAction);
        window.addEventListener('pointercancel', endAction);

        // --- DRAGGABLE UNDO/REDO BAR ---
        const topActionsBar = document.getElementById('topActionsBar');
        let dragTimer = null;
        let isDraggingBar = false;
        let wasDragged = false;
        let barOffsetX = 0;
        let barOffsetY = 0;

        topActionsBar.addEventListener('pointerdown', (e) => {
            e.stopPropagation(); 
            const rect = topActionsBar.getBoundingClientRect();
            barOffsetX = e.clientX - rect.left;
            barOffsetY = e.clientY - rect.top;
            wasDragged = false;

            // 300ms hold to activate dragging
            dragTimer = setTimeout(() => {
                isDraggingBar = true;
                wasDragged = true;
                topActionsBar.style.opacity = '0.5';
                topActionsBar.setPointerCapture(e.pointerId);
            }, 300); 
        });

        topActionsBar.addEventListener('pointermove', (e) => {
            if (!isDraggingBar) return;
            e.preventDefault();

            let newX = e.clientX - barOffsetX;
            let newY = e.clientY - barOffsetY;
            
            newX = Math.max(0, Math.min(newX, window.innerWidth - topActionsBar.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - topActionsBar.offsetHeight));

            topActionsBar.style.left = newX + 'px';
            topActionsBar.style.top = newY + 'px';
            topActionsBar.style.right = 'auto'; 
        });

        const stopDragging = (e) => {
            clearTimeout(dragTimer);
            if (isDraggingBar) {
                isDraggingBar = false;
                topActionsBar.style.opacity = '1';
                try { topActionsBar.releasePointerCapture(e.pointerId); } catch(err){}
            }
        };

        topActionsBar.addEventListener('pointerup', stopDragging);
        topActionsBar.addEventListener('pointercancel', stopDragging);

        // Prevent button click if we just finished dragging the bar
        topActionsBar.addEventListener('click', (e) => {
            if (wasDragged) {
                e.stopPropagation();
                e.preventDefault();
                wasDragged = false;
            }
        }, true);


        // --- UTILITIES ---
        document.getElementById('undoBtn').addEventListener('click', () => {
            if (strokes.length > 0) { redoStack.push(strokes.pop()); selectedIndex = -1; redraw(); saveToLocal(); }
        });

        document.getElementById('redoBtn').addEventListener('click', () => {
            if (redoStack.length > 0) { strokes.push(redoStack.pop()); redraw(); saveToLocal(); }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (confirm("Wipe canvas?")) { strokes = []; redoStack = []; selectedIndex = -1; redraw(); saveToLocal(); }
        });

        document.getElementById('gridBtn').addEventListener('click', (e) => {
            showGrid = !showGrid;
            e.currentTarget.style.color = showGrid ? 'var(--active-color)' : 'var(--text-color)';
            redraw();
        });

        document.getElementById('zoomLockBtn').addEventListener('click', (e) => {
            isZoomLocked = !isZoomLocked;
            const icon = e.currentTarget.querySelector('i');
            if (isZoomLocked) {
                icon.className = 'fa-solid fa-lock';
                e.currentTarget.style.color = '#ff3b30'; 
            } else {
                icon.className = 'fa-solid fa-lock-open';
                e.currentTarget.style.color = 'var(--text-color)';
            }
        });

        document.getElementById('recenterBtn').addEventListener('click', () => {
            if (strokes.length === 0) {
                panX = 0; panY = 0; zoomLevel = 1;
            } else {
                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                strokes.forEach(s => s.points.forEach(p => {
                    if(p.x < minX) minX = p.x; if(p.y < minY) minY = p.y;
                    if(p.x > maxX) maxX = p.x; if(p.y > maxY) maxY = p.y;
                }));
                const w = maxX - minX; const h = maxY - minY;
                const scaleX = (window.innerWidth - 50) / w;
                const scaleY = (window.innerHeight - 50) / h;
                zoomLevel = Math.max(0.1, Math.min(scaleX, scaleY, 2)); 
                panX = (window.innerWidth / 2) - ((minX + w/2) * zoomLevel);
                panY = (window.innerHeight / 2) - ((minY + h/2) * zoomLevel);
            }
            redraw();
        });

        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error("Error attempting to enable fullscreen:", err.message);
                });
            } else {
                document.exitFullscreen();
            }
        });

        // --- SUB-MENU & TOOL LOGIC ---
        const masterPenBtn = document.getElementById('tool-master-pen');
        const penSubMenu = document.getElementById('penSubMenu');
        const eraserSliderMenu = document.getElementById('eraserSliderMenu');

        masterPenBtn.addEventListener('click', () => {
            eraserSliderMenu.style.display = 'none';
            if (['ball', 'ink', 'pencil', 'brush', 'highlighter'].includes(currentTool)) {
                penSubMenu.style.display = penSubMenu.style.display === 'flex' ? 'none' : 'flex';
            } else {
                document.querySelectorAll('#mainToolbar button.tool-btn.active').forEach(b => b.classList.remove('active'));
                masterPenBtn.classList.add('active');
                
                const activeSubPen = document.querySelector('#penSubMenu button.tool-btn.active');
                if (activeSubPen) currentTool = activeSubPen.id.replace('tool-', '');
                else currentTool = 'ball'; 
                
                penSubMenu.style.display = 'flex';
                selectedIndex = -1; 
                redraw();
            }
        });

        const otherTools = document.querySelectorAll('.toolbar button.tool-btn[id^="tool-"]:not(#tool-master-pen)');
        otherTools.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const clickedTool = e.currentTarget.id.replace('tool-', '');
                
                if (['ball', 'ink', 'pencil', 'brush', 'highlighter'].includes(clickedTool)) {
                    document.querySelectorAll('#penSubMenu button.tool-btn.active').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    currentTool = clickedTool;
                    return; 
                }

                penSubMenu.style.display = 'none';
                document.querySelectorAll('#mainToolbar button.tool-btn.active').forEach(b => b.classList.remove('active'));
                
                if (clickedTool === 'eraser') {
                    e.currentTarget.classList.add('active');
                    eraserSliderMenu.style.display = eraserSliderMenu.style.display === 'flex' ? 'none' : 'flex';
                } else {
                    eraserSliderMenu.style.display = 'none';
                    e.currentTarget.classList.add('active');
                }

                currentTool = clickedTool;
                if (currentTool !== 'select') { selectedIndex = -1; redraw(); }
            });
        });

        document.getElementById('penSlider').addEventListener('input', (e) => {
            penSize = parseInt(e.target.value);
            document.getElementById('penLabel').textContent = penSize + 'px';
        });

        document.getElementById('eraserSlider').addEventListener('input', (e) => {
            eraserSize = parseInt(e.target.value);
            document.getElementById('eraserLabel').textContent = eraserSize + 'px';
        });

        const colorBtns = document.querySelectorAll('.color-btn');
        const hexInput = document.getElementById('hexInput');

        function updateColor(color) {
            brushColor = color;
            document.querySelector('.color-btn.active')?.classList.remove('active');
            if(currentTool === 'eraser' || currentTool === 'hand' || currentTool === 'select') {
                 masterPenBtn.click(); 
            }
        }

        colorBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const color = e.currentTarget.dataset.color;
                updateColor(color);
                e.currentTarget.classList.add('active');
                hexInput.value = color.replace('#', '');
            });
        });

        hexInput.addEventListener('input', (e) => {
            let val = e.target.value.replace('#', '');
            if (val.length === 6 || val.length === 3) {
                const newColor = '#' + val;
                updateColor(newColor);
                colorBtns.forEach(btn => {
                    if(btn.dataset.color.toLowerCase() === newColor.toLowerCase()) btn.classList.add('active');
                });
            }
        });

        const container = document.getElementById('toolbarContainer');
        document.getElementById('squeezeBtn').addEventListener('click', () => container.classList.add('squeezed'));
        document.getElementById('expandBtn').addEventListener('click', () => container.classList.remove('squeezed'));
    </script>
</body>
</html>
